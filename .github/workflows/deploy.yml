name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Vercel deployment
        id: deploy
        run: |
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "nextjs-app",
              "project": "'"$PROJECT_ID"'",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repo": "'"${{ github.repository }}"'",
                "ref": "'"${{ github.ref_name }}"'"
              }
            }')

          echo "Response: $RESPONSE"

          DEPLOYMENT_URL=$(echo $RESPONSE | jq -r '.url')

          echo "deployment_url=https://$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Show deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment_url }}"
